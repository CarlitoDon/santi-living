name: Analytics Anomaly Monitor

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "UTC target date (YYYY-MM-DD); leave blank for yesterday"
        required: false
        type: string
      fail_on_anomaly:
        description: "Fail the run when the monitor detects an anomaly"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: analytics-anomaly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Collect analytics anomaly snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
      GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
      GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
      LEAD_EVENTS_ADMIN_TOKEN: ${{ secrets.LEAD_EVENTS_ADMIN_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      VERCEL_USAGE_REPORT_URL: ${{ secrets.VERCEL_USAGE_REPORT_URL }}
      VERCEL_USAGE_TOKEN: ${{ secrets.VERCEL_USAGE_TOKEN }}
      TARGET_DATE: ${{ inputs.target_date }}
      FAIL_ON_ANOMALY: ${{ inputs.fail_on_anomaly }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .cache/analytics-anomaly
          key: analytics-anomaly-state-${{ github.run_id }}
          restore-keys: |
            analytics-anomaly-state-

      - name: Run monitor
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/santi-living-analytics-anomaly" .cache/analytics-anomaly
          args=(
            --output-dir "$RUNNER_TEMP/santi-living-analytics-anomaly"
            --alert-state-file "$GITHUB_WORKSPACE/.cache/analytics-anomaly/alert-state.json"
          )

          if [[ -n "${TARGET_DATE:-}" ]]; then
            args+=(--target-date "$TARGET_DATE")
          fi
          if [[ "${FAIL_ON_ANOMALY:-false}" == "true" ]]; then
            args+=(--fail-on-anomaly)
          fi

          python3 scripts/analytics_anomaly_monitor.py "${args[@]}"

      - name: Add report to job summary
        if: always()
        run: |
          set -euo pipefail
          report="$(find "$RUNNER_TEMP/santi-living-analytics-anomaly" -maxdepth 1 -name '*.md' -print -quit 2>/dev/null || true)"
          if [[ -n "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Monitor did not produce a Markdown report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/analytics-anomaly
          key: analytics-anomaly-state-${{ github.run_id }}

      - name: Upload anomaly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-anomaly-${{ github.run_id }}
          path: ${{ runner.temp }}/santi-living-analytics-anomaly
          if-no-files-found: warn
          retention-days: 30
